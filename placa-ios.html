<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placa rápida iPhone</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111;--mut:#666;--bd:#d0d4da;--ac:#1a56db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#202327;--tx:#f1f1f1;--mut:#9aa0a6;--bd:#3a3f45;--ac:#6ea0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,Helvetica,Arial,sans-serif;padding:14px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:18px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;font-size:18px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-weight:600;-webkit-appearance:none}
.row{display:flex;gap:10px}.row>div{flex:1}
.cp{display:flex;gap:6px;max-width:220px}
.cp button{width:48px;flex:none;padding:0;font-size:24px}
.cp input{text-align:center;padding:10px 4px}
.btns{display:flex;gap:10px;margin:12px 0}
button{flex:1;font-size:17px;padding:14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
#sv{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--bd)}
.hint{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.4}
#pa{display:none}
@page{size:A4 landscape;margin:0}
@media print{
 html,body{background:#fff!important;margin:0!important;padding:0!important}
 .wrap{display:none!important}
 #pa{display:block}
 #pa div{width:297mm;height:209mm;overflow:hidden}
 #pa svg{display:block;width:297mm;height:209mm}
}
</style>
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1a56db"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Placa"></head>
<body>
<div class="wrap">
 <h1>🏷️ Placa rápida (iPhone)</h1>
 <svg id="sv" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" font-weight="700" text-anchor="middle">
  <rect x="0" y="0" width="297" height="210" fill="#fff"/>
  <rect x="8" y="8" width="281" height="194" fill="#fff" stroke="#000" stroke-width="0.9"/>
  <line x1="8" y1="175" x2="289" y2="175" stroke="#000" stroke-width="0.9"/>
  <line x1="148.5" y1="175" x2="148.5" y2="202" stroke="#000" stroke-width="0.9"/>
  <text class="a" x="148.5" y="110" font-size="60" fill="#000"> </text>
  <text class="b" x="78.5" y="195" font-size="16" fill="#000"> </text>
  <text class="c" x="218.5" y="195" font-size="16" fill="#000"> </text>
 </svg>
 <label for="t1">Campo 1 — texto grande</label>
 <input id="t1" value="226G5" autocapitalize="characters" autocomplete="off">
 <div class="row">
  <div><label for="t2">Campo 2 — local</label><input id="t2" value="Guarulhos" autocomplete="off"></div>
  <div><label for="t3">Campo 3 — turno</label><input id="t3" value="3º Turno" autocomplete="off"></div>
 </div>
 <label for="n">Cópias</label>
 <div class="cp"><button id="mn" type="button">−</button><input id="n" type="number" inputmode="numeric" value="1"><button id="pl" type="button">+</button></div>
 <div class="btns">
  <button class="p" id="shr" type="button">📤 Enviar para imprimir</button>
  <button id="prt" type="button">🖨️ Imprimir</button>
 </div>
 <div class="btns"><button id="clr" type="button">Limpar campos</button></div>
 <div class="hint"><b>Recomendado:</b> toque em “Enviar para imprimir” → no menu do iPhone escolha <b>Imprimir</b> → selecione a impressora e as cópias. Os últimos textos ficam salvos neste aparelho.</div>
</div>
<div id="pa"></div>
<script>
var $=function(i){return document.getElementById(i)};
var sv=$('sv');
function q(c){return sv.querySelector('.'+c)}
function fit(el,txt,maxW,maxS){
  el.textContent=txt;el.setAttribute('font-size','100');
  var w=0;try{w=el.getComputedTextLength()}catch(e){}
  if(!(w>0))w=txt.length*68;
  return Math.min(maxS,100*maxW/w);
}
function paint(){
  var t1=$('t1').value||' ',t2=($('t2').value||' ').toUpperCase(),t3=($('t3').value||' ').toUpperCase();
  var a=q('a'),b=q('b'),c=q('c');
  var sm=fit(a,t1,264,185);a.setAttribute('font-size',sm);a.setAttribute('y',91.5+sm*0.36);
  var s2=fit(b,t2,123,20),s3=fit(c,t3,123,20),sf=Math.min(s2,s3);
  b.setAttribute('font-size',sf);c.setAttribute('font-size',sf);
  b.setAttribute('y',188.5+sf*0.36);c.setAttribute('y',188.5+sf*0.36);
  b.textContent=t2;c.textContent=t3;a.textContent=t1;
  try{localStorage.setItem('placaios',JSON.stringify([$('t1').value,$('t2').value,$('t3').value,$('n').value]))}catch(e){}
}
function copies(){var v=parseInt($('n').value,10);if(!(v>=1))v=1;if(v>99)v=99;return v}
function printNow(){
  var pa=$('pa');pa.innerHTML='';var n=copies();
  for(var i=0;i<n;i++){
    var d=document.createElement('div');
    d.style.pageBreakAfter=i<n-1?'always':'auto';
    d.appendChild(sv.cloneNode(true));
    pa.appendChild(d);
  }
  setTimeout(function(){window.print()},100);
}
function share(){
  var W=2970,H=2100;
  var c=sv.cloneNode(true);c.setAttribute('width',W);c.setAttribute('height',H);
  var s=new XMLSerializer().serializeToString(c);
  var img=new Image();
  img.onload=function(){
    var cv=document.createElement('canvas');cv.width=W;cv.height=H;
    var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(img,0,0,W,H);
    cv.toBlob(function(bl){
      var f=new File([bl],'placa.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}
      else{var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='placa.png';document.body.appendChild(a);a.click();a.remove()}
    },'image/png');
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
try{var d=JSON.parse(localStorage.getItem('placaios')||'null');if(d){$('t1').value=d[0];$('t2').value=d[1];$('t3').value=d[2];$('n').value=d[3]||1}}catch(e){}
['t1','t2','t3','n'].forEach(function(i){$(i).addEventListener('input',paint)});
$('mn').onclick=function(){$('n').value=Math.max(1,copies()-1);paint()};
$('pl').onclick=function(){$('n').value=Math.min(99,copies()+1);paint()};
$('clr').onclick=function(){$('t1').value=$('t2').value=$('t3').value='';paint();$('t1').focus()};
$('prt').onclick=printNow;
$('shr').onclick=share;
paint();setTimeout(paint,250);
</script>
</body>
</html>
