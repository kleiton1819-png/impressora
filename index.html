<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placa rápida</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111;--mut:#666;--bd:#d0d4da;--ac:#1a56db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#202327;--tx:#f1f1f1;--mut:#9aa0a6;--bd:#3a3f45;--ac:#6ea0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:14px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:18px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font-size:18px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-weight:600}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:10px;margin:12px 0}
button{flex:1;font-size:17px;padding:14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.opts{display:flex;gap:12px;align-items:flex-end;margin-top:10px}
.opts>div{flex:1}
.cp{display:flex;gap:6px}
.cp button{flex:0 0 48px;padding:0;font-size:24px}
.cp input{text-align:center;padding:10px 4px}
#prev{margin-top:6px}
.hint{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.4}
#pa{display:none}
@media print{
 html,body{background:#fff!important;margin:0!important;padding:0!important}
 .wrap,.ui{display:none!important}
 #pa{display:block}
}
</style>
<style id="pg"></style>
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1a56db"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Placa"></head>
<body>
<div class="wrap">
 <div class="ui">
  <h1>🏷️ Placa rápida</h1>
  <label for="t1">Campo 1 — texto grande</label>
  <input id="t1" value="226G5" autocapitalize="characters" autocomplete="off">
  <div class="row">
   <div><label for="t2">Campo 2 — local</label><input id="t2" value="Guarulhos" autocomplete="off"></div>
   <div><label for="t3">Campo 3 — turno</label><input id="t3" value="3º Turno" autocomplete="off"></div>
  </div>
  <div class="opts">
   <div><label for="n">Cópias</label>
    <div class="cp"><button id="mn" type="button">−</button><input id="n" type="number" inputmode="numeric" min="1" max="99" value="1"><button id="pl" type="button">+</button></div>
   </div>
   <div><label for="ori">Orientação</label>
    <select id="ori"><option value="landscape">Paisagem</option><option value="portrait">Retrato</option></select>
   </div>
  </div>
  <div class="btns">
   <button id="clr" type="button">Limpar</button>
   <button class="p" id="prt" type="button">🖨️ Imprimir</button>
  </div>
 </div>
 <div id="prev"></div>
 <div class="ui btns"><button id="shr" type="button">📤 Compartilhar imagem</button></div>
 <div class="ui hint">Imprimir: escolha a impressora Wi-Fi na tela do celular (papel A4). Se a tela de impressão alterar o layout, use “Compartilhar imagem” e imprima pelo app da sua impressora. Os últimos textos ficam salvos neste aparelho.</div>
</div>
<div id="pa"></div>
<script>
var $=function(i){return document.getElementById(i)};
var FONT='Calibri,Carlito,Arial,Helvetica,sans-serif';
var ctx=document.createElement('canvas').getContext('2d');
function em(txt){ctx.font='700 100px '+FONT;return ctx.measureText(txt).width/100}
function layout(W,H){
  var footH=Math.min(W*0.14,H*0.2),mainH=H-footH;
  var t1=$('t1').value||' ',t2=($('t2').value||' ').toUpperCase(),t3=($('t3').value||' ').toUpperCase();
  var sm=Math.min(W*0.94/Math.max(em(t1),0.1),mainH*0.8);
  var half=W/2*0.88;
  var sf=Math.min(footH*0.5,half/Math.max(em(t2),0.1),half/Math.max(em(t3),0.1));
  return {footH:footH,mainH:mainH,sm:sm,sf:sf,t1:t1,t2:t2,t3:t3};
}
function build(el,W,H,u,b){
  var L=layout(W-2*b,H-2*b);
  el.innerHTML='';
  el.style.cssText='box-sizing:border-box;width:'+W+u+';height:'+H+u+';border:'+b+u+' solid #000;background:#fff;color:#000;overflow:hidden;font-family:'+FONT+';font-weight:700';
  var m=document.createElement('div');
  m.style.cssText='box-sizing:border-box;width:100%;height:'+L.mainH+u+';line-height:'+L.mainH+u+';font-size:'+L.sm+u+';text-align:center;white-space:nowrap;overflow:hidden';
  m.textContent=L.t1;
  var f=document.createElement('div');
  f.style.cssText='box-sizing:border-box;display:flex;width:100%;height:'+L.footH+u+';border-top:'+b+u+' solid #000';
  [L.t2,L.t3].forEach(function(t,i){
    var c=document.createElement('div');
    c.style.cssText='box-sizing:border-box;flex:1;text-align:center;white-space:nowrap;overflow:hidden;line-height:'+(L.footH-b)+u+';font-size:'+L.sf+u+(i?';border-left:'+b+u+' solid #000':'');
    c.textContent=t;f.appendChild(c);
  });
  el.appendChild(m);el.appendChild(f);
}
function ratio(){return $('ori').value==='portrait'?0.7071:1.4142}
function save(){try{localStorage.setItem('placa',JSON.stringify([$('t1').value,$('t2').value,$('t3').value,$('ori').value,$('n').value]))}catch(e){}}
function render(){
  var host=$('prev');var W=Math.floor(Math.min(host.clientWidth||window.innerWidth-28,560));
  if(!(W>50))W=300;
  var s=host.firstChild;if(!s){s=document.createElement('div');host.appendChild(s)}
  build(s,W,Math.round(W/ratio()),'px',2);
  save();
}
function copies(){var v=parseInt($('n').value,10);if(!(v>=1))v=1;if(v>99)v=99;return v}
function printNow(){
  var land=$('ori').value==='landscape',Pw=land?297:210,Ph=land?210:297,pad=8;
  $('pg').textContent='@page{size:A4 '+$('ori').value+';margin:0}';
  var pa=$('pa');pa.innerHTML='';var n=copies();
  for(var i=0;i<n;i++){
    var pg=document.createElement('div');
    pg.style.cssText='box-sizing:border-box;width:'+Pw+'mm;height:'+(Ph-1)+'mm;padding:'+pad+'mm;overflow:hidden;page-break-after:'+(i<n-1?'always':'auto')+';break-after:'+(i<n-1?'page':'auto');
    var s=document.createElement('div');
    build(s,Pw-2*pad,Ph-1-2*pad,'mm',0.8);
    pg.appendChild(s);pa.appendChild(pg);
  }
  setTimeout(function(){window.print()},80);
}
function shareImg(){
  var land=$('ori').value==='landscape',W=land?1754:1240,H=land?1240:1754,b=6;
  var c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  var m=40,x=m,y=m,w=W-2*m,h=H-2*m;
  var L=layout(w-2*b,h-2*b);
  g.fillStyle='#000';g.fillRect(x,y,w,h);g.fillStyle='#fff';g.fillRect(x+b,y+b,w-2*b,h-2*b);
  g.fillStyle='#000';g.textAlign='center';g.textBaseline='middle';
  g.font='700 '+L.sm+'px '+FONT;g.fillText(L.t1,x+w/2,y+b+L.mainH/2);
  var fy=y+b+L.mainH;g.fillRect(x+b,fy,w-2*b,b);g.fillRect(x+w/2-b/2,fy,b,L.footH);
  g.font='700 '+L.sf+'px '+FONT;
  g.fillText(L.t2,x+w*0.25,fy+L.footH/2);g.fillText(L.t3,x+w*0.75,fy+L.footH/2);
  c.toBlob(function(bl){
    var f=new File([bl],'placa.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}
    else{var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='placa.png';document.body.appendChild(a);a.click();a.remove()}
  },'image/png');
}
try{var d=JSON.parse(localStorage.getItem('placa')||'null');if(d){$('t1').value=d[0];$('t2').value=d[1];$('t3').value=d[2];$('ori').value=d[3]||'landscape';$('n').value=d[4]||1}}catch(e){}
['t1','t2','t3','ori','n'].forEach(function(i){$(i).addEventListener('input',render);$(i).addEventListener('change',render)});
$('mn').onclick=function(){$('n').value=Math.max(1,copies()-1);render()};
$('pl').onclick=function(){$('n').value=Math.min(99,copies()+1);render()};
$('clr').onclick=function(){$('t1').value=$('t2').value=$('t3').value='';render();$('t1').focus()};
$('prt').onclick=printNow;
$('shr').onclick=shareImg;
window.addEventListener('resize',render);
window.addEventListener('load',render);
render();setTimeout(render,200);
</script>
</body>
</html>
